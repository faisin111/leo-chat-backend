name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Format Check (Spotless)
      run: ./mvnw spotless:check || echo "Spotless not configured yet, skipping..."
      
    - name: Run Unit & Integration Tests
      run: ./mvnw verify
      
    - name: Dependency Scan (OWASP)
      run: ./mvnw org.owasp:dependency-check-maven:check || echo "OWASP plugin not configured yet, skipping..."
      
    - name: Build Docker Image
      run: docker build -t chat-app-backend:${{ github.sha }} .
