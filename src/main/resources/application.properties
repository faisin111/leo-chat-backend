spring.application.name=chat-app-backend

# Which profile to use by default if none is specified
spring.profiles.active=dev

# ---------------------------------------------
# GLOBAL SETTINGS (Applies to both dev and prod)
# ---------------------------------------------
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.expirationMs=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.jwtRefreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS:604800000}

server.port=8080

logging.level.org.springframework.security=DEBUG
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

server.shutdown=graceful
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,metrics,prometheus

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.hibernate.ddl-auto=validate

app.jwt.issuer=${JWT_ISSUER:leo-chat-api}
app.jwt.audience=${JWT_AUDIENCE:leo-chat-clients}

app.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.bootstrap.username=${ADMIN_USERNAME:}
app.admin.bootstrap.email=${ADMIN_EMAIL:}
app.admin.bootstrap.password=${ADMIN_PASSWORD:}

app.public.url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.mail.from-address=${MAIL_FROM_ADDRESS:noreply@example.com}

# SMTP configuration is shared by dev and prod; credentials come only from environment.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLED:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}

app.auth.cookies.secure=${AUTH_COOKIE_SECURE:true}
app.auth.cookies.same-site=${AUTH_COOKIE_SAME_SITE:Lax}

# Supabase S3-compatible image storage. Keep disabled until S3 credentials are configured.
app.storage.supabase.enabled=${SUPABASE_STORAGE_ENABLED:false}
app.storage.supabase.endpoint=${SUPABASE_STORAGE_ENDPOINT:https://lzkeptvooqgodjbngsyh.storage.supabase.co/storage/v1/s3}
app.storage.supabase.region=${SUPABASE_STORAGE_REGION:ap-southeast-1}
app.storage.supabase.access-key=${SUPABASE_STORAGE_ACCESS_KEY:disabled}
app.storage.supabase.secret-key=${SUPABASE_STORAGE_SECRET_KEY:disabled}
app.storage.supabase.bucket=${SUPABASE_STORAGE_BUCKET:images}
app.storage.supabase.upload-expiry-seconds=${SUPABASE_STORAGE_UPLOAD_EXPIRY_SECONDS:900}
app.storage.supabase.download-expiry-seconds=${SUPABASE_STORAGE_DOWNLOAD_EXPIRY_SECONDS:900}
app.storage.supabase.max-image-bytes=${SUPABASE_STORAGE_MAX_IMAGE_BYTES:10485760}

# Swagger reads the browser CSRF cookie for mutating requests.
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.csrf.cookie-name=XSRF-TOKEN
springdoc.swagger-ui.csrf.header-name=X-XSRF-TOKEN
