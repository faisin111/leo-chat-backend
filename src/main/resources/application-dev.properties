# DEVELOPMENT PROFILE
# Reads from Environment Variables injected by your host (or .env file)

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# In dev, we can show SQL for debugging
spring.jpa.show-sql=true

# Optionally, you can set a default JWT secret for dev here so you don't need .env
app.jwt.secret=${JWT_SECRET}

# Elastic Email SMTP Configuration
# SMTP settings are inherited from application.properties and environment variables.

app.auth.cookies.secure=${AUTH_COOKIE_SECURE:false}
