# DEVELOPMENT PROFILE
# Uses the local Docker Compose database (see docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/chat_app_db
spring.datasource.username=leochat
spring.datasource.password=secretpassword

# In dev, we can show SQL for debugging
spring.jpa.show-sql=true

# Optionally, you can set a default JWT secret for dev here so you don't need .env
app.jwt.secret=super_secret_key_that_must_be_at_least_32_bytes_long_for_hmac_sha256_dev

# Dummy Mail Configuration for Dev (Use Mailtrap or similar)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
